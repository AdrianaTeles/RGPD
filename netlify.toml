[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/fin.pdf", "public/cgv.pdf", "public/rgpd.pdf", "public/logo.png"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# A CGV pode ser substituída no backoffice (Netlify Blobs). Este rewrite faz com que
# o link estático /cgv.pdf sirva sempre a versão atual, com fallback para o ficheiro
# do bundle. `force = true` é necessário porque public/cgv.pdf existe como ficheiro.
[[redirects]]
  from = "/cgv.pdf"
  to = "/.netlify/functions/documento?nome=cgv.pdf"
  status = 200
  force = true

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
